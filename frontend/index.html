<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatientTriage.ai System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans" x-data="triageApp()">

    <!-- Navbar -->
    <nav class="bg-blue-900 text-white p-4 flex justify-between items-center shadow-md">
        <div class="text-xl font-bold flex items-center">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            PatientTriage.ai
        </div>
        <div class="flex space-x-4 items-center">
            <div class="text-sm font-mono bg-blue-800 px-3 py-1 rounded border border-blue-700 shadow-inner" x-text="currentTime"></div>
            <button @click="tab = 'dashboard'" :class="{'bg-blue-700': tab === 'dashboard'}" class="px-3 py-2 rounded text-sm font-medium hover:bg-blue-800">Dashboard</button>
            <button @click="tab = 'intake'" :class="{'bg-blue-700': tab === 'intake'}" class="px-3 py-2 rounded text-sm font-medium hover:bg-blue-800">Walk-in Intake</button>
            <button @click="tab = 'ambulance'" :class="{'bg-blue-700': tab === 'ambulance'}" class="px-3 py-2 rounded text-sm font-medium hover:bg-blue-800 bg-red-600 hover:bg-red-700">Ambulance Dispatch</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto mt-6 px-4 pb-12 flex space-x-6">
        
        <!-- Left Column: Forms or Dashboard -->
        <div class="flex-grow">
            <!-- TAB: Dashboard -->
            <div x-show="tab === 'dashboard'">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-2xl font-bold text-gray-800">Live Triage Queue</h1>
                    <button @click="fetchData()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm shadow">Refresh</button>
                </div>
                
                <div class="bg-white rounded-lg shadow overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Patient</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ML ESI</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Wait</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Priority</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <template x-for="patient in patients" :key="patient.patient_id">
                                <tr :class="{'bg-red-50': patient.status === 'ambulance'}">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm font-bold text-gray-900" x-text="patient.patient_id"></div>
                                        <div class="text-sm text-gray-500" x-text="patient.symptoms.join(', ')"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span x-show="patient.status === 'ambulance'" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">En-Route</span>
                                        <span x-show="patient.status === 'queue'" class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">Waiting</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-3 py-1 inline-flex text-sm leading-5 font-bold rounded-full"
                                              :class="{
                                                  'bg-red-100 text-red-800': patient.esi === 1,
                                                  'bg-orange-100 text-orange-800': patient.esi === 2,
                                                  'bg-yellow-100 text-yellow-800': patient.esi === 3,
                                                  'bg-green-100 text-green-800': patient.esi === 4,
                                                  'bg-blue-100 text-blue-800': patient.esi === 5
                                              }" x-text="'ESI ' + patient.esi"></span>
                                        <div class="text-xs text-gray-500 mt-1" x-text="patient.confidence + '% Conf'"></div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-mono">
                                        <span x-text="formatWaitTime(patient.arrival_time)"></span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-gray-800" x-text="patient.priority"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- TAB: Intake Form -->
            <div x-show="tab === 'intake' || tab === 'ambulance'">
                <h1 class="text-2xl font-bold text-gray-800 mb-4" x-text="tab === 'intake' ? 'Walk-in Intake Form' : 'Ambulance Pre-Arrival Dispatch'"></h1>
                
                <form @submit.prevent="submitIntake" class="bg-white p-6 rounded-lg shadow space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Patient ID</label>
                            <input type="text" x-model="form.patient_id" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Age</label>
                            <input type="number" x-model="form.age" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Symptoms / Reason for Visit</label>
                        <input type="text" x-model="form.symptoms" required placeholder="e.g. chest pain, fever" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Notes / Family Statements (NLP Input)</label>
                        <textarea x-model="form.family_statements" rows="3" placeholder="Enter paramedic notes or family statements to be analyzed by AI..." class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3"></textarea>
                    </div>

                    <div class="grid grid-cols-4 gap-4 bg-gray-50 p-4 rounded border">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase">SpO2 (%)</label>
                            <input type="number" x-model="form.spo2" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-1 px-2">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase">Heart Rate</label>
                            <input type="number" x-model="form.hr" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-1 px-2">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase">Sys BP</label>
                            <input type="number" x-model="form.bp_sys" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-1 px-2">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 uppercase">Temp (C)</label>
                            <input type="number" step="0.1" x-model="form.temp_c" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-1 px-2">
                        </div>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded" x-text="tab === 'intake' ? 'Admit to Queue' : 'Dispatch to ED'"></button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Right Column: Reminders Panel -->
        <div class="w-80 flex-shrink-0">
            <div class="bg-white rounded-lg shadow p-4 border-t-4 border-yellow-400">
                <h2 class="text-lg font-bold text-gray-800 flex items-center mb-4">
                    <svg class="w-5 h-5 mr-1 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"></path></svg>
                    Action Reminders
                </h2>
                
                <div x-show="reminders.length === 0" class="text-sm text-gray-500 italic">No pending actions. Queue is optimized.</div>
                
                <div class="space-y-3">
                    <template x-for="rem in reminders" :key="rem.patient_id">
                        <div class="bg-yellow-50 p-3 rounded border border-yellow-200">
                            <p class="font-bold text-sm text-yellow-800" x-text="rem.patient_id"></p>
                            <p class="text-xs text-gray-700 mt-1" x-text="rem.message"></p>
                            <button @click="dismissReminder(rem)" class="mt-2 text-xs bg-yellow-200 hover:bg-yellow-300 text-yellow-800 px-2 py-1 rounded w-full">Mark Re-Assessed</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        function triageApp() {
            return {
                tab: 'dashboard',
                currentTime: new Date().toLocaleTimeString(),
                now: new Date(),
                patients: [],
                reminders: [],
                form: { patient_id: '', age: '', symptoms: '', family_statements: '', spo2: '', hr: '', bp_sys: '', temp_c: '' },
                
                init() {
                    this.fetchData();
                    // Poll backend every 10 seconds for priority/reminders updates
                    setInterval(() => { if (this.tab === 'dashboard') this.fetchData(); }, 10000);
                    // Local timer every second for smooth ticking UI
                    setInterval(() => {
                        this.now = new Date();
                        this.currentTime = this.now.toLocaleTimeString();
                    }, 1000);
                },

                formatWaitTime(arrivalIso) {
                    if (!arrivalIso) return "0m 0s";
                    const diff = Math.max(0, Math.floor((this.now - new Date(arrivalIso)) / 1000));
                    const m = Math.floor(diff / 60);
                    const s = diff % 60;
                    return `${m}m ${s}s`;
                },
                
                async fetchData() {
                    try {
                        const res = await fetch('/api/patients');
                        const data = await res.json();
                        this.patients = data.queue;
                        this.reminders = data.reminders;
                    } catch (e) {
                        console.error('Failed to fetch data', e);
                    }
                },

                async submitIntake() {
                    const payload = {
                        ...this.form,
                        age: parseInt(this.form.age),
                        spo2: this.form.spo2 ? parseFloat(this.form.spo2) : null,
                        hr: this.form.hr ? parseFloat(this.form.hr) : null,
                        bp_sys: this.form.bp_sys ? parseFloat(this.form.bp_sys) : null,
                        temp_c: this.form.temp_c ? parseFloat(this.form.temp_c) : null,
                        mode: this.tab
                    };

                    try {
                        await fetch('/api/intake', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        alert(this.tab === 'intake' ? 'Patient added to queue!' : 'Ambulance dispatched to queue!');
                        this.form = { patient_id: '', age: '', symptoms: '', family_statements: '', spo2: '', hr: '', bp_sys: '', temp_c: '' };
                        this.fetchData();
                        this.tab = 'dashboard';
                    } catch (e) {
                        alert('Error submitting data');
                    }
                },

                dismissReminder(rem) {
                    // In a full app, this would hit a POST /reassess endpoint.
                    // For the UI, we just dismiss it from the local array.
                    this.reminders = this.reminders.filter(r => r.patient_id !== rem.patient_id);
                }
            }
        }
    </script>
</body>
</html>
